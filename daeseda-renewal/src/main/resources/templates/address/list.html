<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>주소 목록</title>
  <meta charset="UTF-8">
</head>
<body>
<h2>주소 목록</h2>

<table border="1">
  <thead>
  <tr>
    <th>ID</th>
    <th>이름</th>
    <th>상세 주소</th>
    <th>우편번호</th>
    <th>도로명 주소</th>
    <th>기본 주소</th>
    <th>삭제</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="address : ${addresses}">
    <td th:text="${address.addressId}"></td>
    <td th:text="${address.addressName}"></td>
    <td th:text="${address.addressDetail}"></td>
    <td th:text="${address.addressZipcode}"></td>
    <td th:text="${address.addressRoad}"></td>
    <td th:text="${address.defaultAddress} ? 'Y' : 'N'"></td>
    <td>
      <button type="button"
              class="delete-btn"
              th:data-address-id="${address.addressId}"
              th:data-user-id="${address.userId}">
        삭제
      </button>
    </td>
  </tr>
  </tbody>
</table>
<a th:href="@{/}">홈으로 이동</a>
<a th:href="@{/addresses/form}">주소 추가</a>

<script>
  document.querySelectorAll(".delete-btn").forEach(button => {
    button.addEventListener("click", async function () {
      const addressId = this.dataset.addressId;
      const userId = this.dataset.userId;

      try {
        const response = await fetch("/api/addresses/delete", {
          method: "DELETE",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({addressId, userId})
        });

        if (response.ok) {
          // 삭제 후 목록 새로고침
          window.location.href = "/addresses/list";
        } else {
          alert("주소 삭제 실패");
        }
      } catch (error) {
        console.error("삭제 중 오류:", error);
        alert("통신 오류 발생");
      }
    });
  });
</script>
</body>
</html>
