<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" href="/images/logo.png"/>
  <script src="https://kit.fontawesome.com/08edd7b20e.js" crossorigin="anonymous"></script>
  <title>회원가입</title>
  <style>
    .email-message {
      margin-top: 5px;
      font-size: 0.9em;
    }
  </style>
</head>

<body>
<form id="signupForm" class="signup-form">
  <h3 class="signup-title">회원가입</h3>
  <p id="statusMessage" style="color: red;"></p>

  <!-- 이름 -->
  <div class="input-wrapper">
    <i class="fa-regular fa-user icon name-icon"></i>
    <input type="text" placeholder="이름" name="name" required class="input name-input"/>
  </div>

  <!-- 이메일 -->
  <div class="input-wrapper">
    <i class="fa-solid fa-envelope icon email-icon"></i>
    <input type="email" placeholder="이메일" name="email" required class="input email-input"/>
    <button type="button" onclick="checkDuplicateEmail()" class="check-duplicate-button">중복 확인
    </button>
    <p class="email-message"></p>
  </div>

  <!-- 비밀번호 -->
  <div class="input-wrapper">
    <i class="fa-solid fa-key icon password-icon"></i>
    <input type="password" placeholder="비밀번호" name="password" required
           class="input password-input"/>
  </div>

  <!-- 닉네임 -->
  <div class="input-wrapper">
    <i class="fa-regular fa-user icon name-icon"></i>
    <input type="text" placeholder="닉네임" name="nickname" required class="input nickname-input"/>
  </div>

  <!-- 전화번호 -->
  <div class="input-wrapper">
    <i class="fa-regular fa-user icon name-icon"></i>
    <input type="text" placeholder="전화번호" name="phone" required class="input phone-input"/>
  </div>

  <!-- 제출 버튼 -->
  <button type="submit" class="submit-button">가입하기</button>

  <p class="login-return-button">
    이미 회원이신가요?
    <a th:href="@{/users/login}" class="login-return-tag">로그인으로 돌아가기</a>
    <a th:href="@{/}">홈으로 이동</a>
  </p>
</form>

<script>
  async function checkDuplicateEmail() {
    const emailInput = document.querySelector(".email-input");
    const email = emailInput.value;
    const message = document.querySelector(".email-message");

    if (!email) {
      message.textContent = "이메일을 입력해주세요.";
      message.style.color = "red";
      return;
    }

    try {
      const response = await fetch(`/api/users/check-email?email=${encodeURIComponent(email)}`);
      const result = await response.json();

      if (result.duplicate) {
        message.textContent = "이미 사용 중인 이메일입니다.";
        message.style.color = "red";
      } else {
        message.textContent = "사용 가능한 이메일입니다.";
        message.style.color = "green";
      }
    } catch (error) {
      console.error("Error checking email:", error);
      message.textContent = "오류 발생. 다시 시도해주세요.";
      message.style.color = "red";
    }
  }

  document.getElementById("signupForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const userName = document.querySelector(".name-input").value;
    const userEmail = document.querySelector(".email-input").value;
    const userPassword = document.querySelector(".password-input").value;
    const userNickname = document.querySelector(".nickname-input").value;
    const userPhone = document.querySelector(".phone-input").value;
    const statusMessage = document.getElementById("statusMessage");

    try {
      const response = await fetch("/api/users/signup", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({userName, userEmail, userPassword, userNickname, userPhone}),
      });

      if (response.ok) {
        alert("회원가입 성공! 로그인 페이지로 이동합니다.");
        window.location.href = "/users/login";
      } else {
        const result = await response.json();
        statusMessage.textContent = result.message || "회원가입 실패. 다시 시도해주세요.";
      }
    } catch (error) {
      console.error("Signup error:", error);
      statusMessage.textContent = "오류 발생. 다시 시도해주세요.";
    }
  });
</script>
</body>

</html>
