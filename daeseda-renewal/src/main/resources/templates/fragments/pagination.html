<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="pager(page, q, sort, size)">
  <nav th:if="${page.totalPages > 1}">
    <ul class="pagination justify-content-center">
      <li class="page-item" th:classappend="${page.first} ? 'disabled'">
        <a class="page-link"
           th:href="@{/templates/post(page=${page.number - 1}, size=${size}, q=${q}, sort=${sort})}">이전</a>
      </li>
      <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
          th:classappend="${i} == ${page.number} ? 'active'">
        <a class="page-link" th:text="${i + 1}"
           th:href="@{/templates/post(page=${i}, size=${size}, q=${q}, sort=${sort})}"></a>
      </li>
      <li class="page-item" th:classappend="${page.last} ? 'disabled'">
        <a class="page-link"
           th:href="@{/templates/post(page=${page.number + 1}, size=${size}, q=${q}, sort=${sort})}">다음</a>
      </li>
    </ul>
  </nav>
</div>
</body>
</html>
