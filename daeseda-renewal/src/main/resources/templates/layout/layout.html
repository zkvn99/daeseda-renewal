<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:replace="~{::title}">게시판</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
  <!-- 필요 시 Spring Security가 채워주는 CSRF 메타 (없어도 동작) -->
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <style>
    .container-narrow {
      max-width: 980px;
    }

    pre {
      white-space: pre-wrap;
    }

    .toastbox {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 1080
    }
  </style>
</head>
<body>
<header class="border-bottom mb-4">
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container container-narrow">
      <a class="navbar-brand" th:href="@{/templates/post}">게시판</a>
    </div>
  </nav>
</header>
<main class="container container-narrow">
  <div th:replace="~{::section}"></div>
</main>
<footer class="mt-5 py-4 border-top text-center text-muted">
  <small>Hybrid SSR + Fetch</small>
</footer>
<div class="toastbox" id="toastbox"></div>
<script>
  // ---- Toast ----
  function toast(msg) {
    const box = document.getElementById('toastbox');
    const el = document.createElement('div');
    el.className = 'alert alert-dark shadow-sm py-2 px-3 mb-2';
    el.textContent = msg;
    box.appendChild(el);
    setTimeout(() => {
      el.remove()
    }, 2000);
  }

  // ---- CSRF helper (있으면 사용, 없으면 무시) ----
  const CSRF = (() => {
    const t = document.querySelector('meta[name="_csrf"]')?.content;
    const h = document.querySelector('meta[name="_csrf_header"]')?.content;
    return {
      apply(init = {}) {
        const headers = new Headers(init.headers || {});
        if (t && h) {
          headers.set(h, t);
        }
        return {...init, headers};
      }
    }
  })();

  // ---- fetch JSON helper ----
  async function httpJson(url, init = {}) {
    const merged = CSRF.apply({
      credentials: 'same-origin',
      ...init,
      headers: {'Content-Type': 'application/json', ...(init.headers || {})}
    });
    const res = await fetch(url, merged);
    if (!res.ok) {
      const text = await res.text();
      throw new Error(text || res.statusText);
    }
    const ct = res.headers.get('content-type') || '';
    return ct.includes('application/json') ? res.json() : null;
  }

  // ---- URL helpers ----
  const URLH = {
    get() {
      return new URL(location.href)
    },
    params() {
      return this.get().searchParams
    },
    toQuery(obj) {
      const u = this.get();
      Object.entries(obj).forEach(([k, v]) => {
        if (v === undefined || v === null || v === '') {
          u.searchParams.delete(
              k);
        } else {
          u.searchParams.set(k, v)
        }
      });
      return u
    }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
