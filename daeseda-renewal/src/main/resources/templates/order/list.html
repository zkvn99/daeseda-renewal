<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>주문 목록</title>
</head>
<body>
<h2>주문 목록</h2>

<table border="1">
  <thead>
  <tr>
    <th>주문 ID</th>
    <th>배송일</th>
    <th>픽업일시</th>
    <th>주문 상태</th>
    <th>총 금액</th>
    <th>세탁 방식</th>
    <th>회원 ID</th>
    <th>주소 ID</th>
    <th>주문 취소</th>
    <th>결제 완료</th>
    <th>배송 상세 보기</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="order : ${orders}">
    <td th:text="${order.orderId}"></td>
    <td th:text="${order.deliveryDate}"></td>
    <td th:text="${order.pickupDate != null} ? ${#temporals.format(order.pickupDate, 'yyyy-MM-dd HH:mm:ss')} : '미정'"></td>
    <td th:text="${order.orderStatus}"></td>
    <td th:text="${order.totalPrice}"></td>
    <td th:text="${order.washingMethod}"></td>
    <td th:text="${order.userName}"></td>
    <td th:text="${order.address}"></td>
    <td>
      <button type="button"
              class="cancel-btn"
              th:data-order-id="${order.orderId}">
        주문 취소
      </button>
    </td>
    <td>
      <button type="button"
              class="cash-btn"
              th:data-order-id="${order.orderId}">
        결제완료
      </button>
    </td>
    <td>
      <button type="button" class="delivery-btn" th:data-order-id="${order.orderId}">
        배송 상세 보기
      </button>
    </td>
  </tr>
  </tbody>
</table>

<a href="/">홈으로 이동</a>
<a href="/order/form">주문 추가</a>

<script>
  document.querySelectorAll(".cancel-btn").forEach(button => {
    button.addEventListener("click", async function () {
      const orderId = this.dataset.orderId;

      try {
        const response = await fetch("/api/orders/cancel", {
          method: "PATCH",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({orderId})
        });

        if (response.ok) {
          window.location.href = "/orders/list";
        } else {
          alert("주문 취소 실패");
        }
      } catch (error) {
        console.error("삭제 중 오류:", error);
        alert("통신 오류 발생");
      }
    });
  });
  document.querySelectorAll(".cash-btn").forEach(button => {
    button.addEventListener("click", async function () {
      const orderId = this.dataset.orderId;

      try {
        const response = await fetch("/api/orders/cash", {
          method: "PATCH",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({orderId})
        });

        if (response.ok) {
          window.location.href = "/orders/list";
        } else {
          alert("주문 취소 실패");
        }
      } catch (error) {
        console.error("삭제 중 오류:", error);
        alert("통신 오류 발생");
      }
    });
  });
  document.querySelectorAll(".delivery-btn").forEach(button => {
    button.addEventListener("click", function () {
      const orderId = this.dataset.orderId;
      window.location.href = `/deliveries/${orderId}`;
    });
  });
</script>
</body>
</html>
