<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <title>게시글</title>
</head>
<body>
<section th:replace="layout/layout :: section">
  <div class="d-flex justify-content-between align-items-start">
    <div>
      <h2 class="mb-1" id="title"></h2>
      <div class="text-muted" id="meta"></div>
    </div>
    <div class="d-flex gap-2">
      <a class="btn btn-outline-secondary" th:href="@{/templates/post}">목록</a>
      <a class="btn btn-outline-primary" id="editBtn">수정</a>
      <button class="btn btn-danger" id="delBtn">삭제</button>
    </div>
  </div>
  <hr/>
  <pre class="mt-3" id="content"></pre>
</section>
<script>
  const id = location.pathname.split('/').pop();
  const fmt = (iso) => new Date(iso).toLocaleString();

  async function load() {
    const p = await httpJson(`/api/boards/${id}?increaseViews=true`);
    document.getElementById('title').textContent = p.title;
    document.getElementById('meta').textContent = `${p.author} • ${fmt(
        p.createdAt)} • 조회 ${p.views}` + (p.updatedAt ? ` • 수정 ${fmt(p.updatedAt)}` : '');
    document.getElementById('content').textContent = p.content;
    document.getElementById('editBtn').href = `/board/${id}/edit`;
  }

  document.getElementById('delBtn').onclick = async () => {
    if (!confirm('삭제하시겠습니까?')) {
      return;
    }
    try {
      await httpJson(`/api/boards/${id}`, {method: 'DELETE'});
      location.href = '/board';
    } catch (e) {
      toast('삭제 실패: ' + e.message);
    }
  };
  load();
</script>
</body>
</html>
