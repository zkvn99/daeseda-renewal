<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <title>글 작성/수정</title>
</head>
<body>
<section th:replace="layout/layout :: section">
  <h2 id="formTitle">새 글 쓰기</h2>
  <form id="postForm" class="mt-3">
    <div class="mb-3">
      <label class="form-label">제목</label>
      <input type="text" class="form-control" name="title" maxlength="120" required/>
    </div>
    <div class="mb-3">
      <label class="form-label">작성자</label>
      <input type="text" class="form-control" name="author" required/>
    </div>
    <div class="mb-3">
      <label class="form-label">내용</label>
      <textarea class="form-control" name="content" rows="12" required></textarea>
    </div>
    <div class="d-flex justify-content-between">
      <a class="btn btn-outline-secondary" th:href="@{/templates/post}">목록</a>
      <button class="btn btn-primary" type="submit">저장</button>
    </div>
  </form>
</section>
<script>
  const path = location.pathname; // /board/new or /board/{id}/edit
  const isEdit = /\/edit$/.test(path);
  const id = isEdit ? path.split('/').slice(-2)[0] : null;
  const $f = document.getElementById('postForm');
  const $title = document.getElementById('formTitle');

  async function init() {
    if (isEdit) {
      $title.textContent = '글 수정';
      const p = await httpJson(`/api/boards/${id}`);
      $f.title.value = p.title;
      $f.author.value = p.author;
      $f.content.value = p.content;
    }
  }

  $f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const body = JSON.stringify({
      title: $f.title.value.trim(),
      author: $f.author.value.trim(),
      content: $f.content.value.trim()
    });
    try {
      if (isEdit) {
        await httpJson(`/api/boards/${id}`, {method: 'PUT', body});
        location.href = `/board/${id}`;
      } else {
        const res = await httpJson('/api/boards', {method: 'POST', body});
        location.href = `/board/${res.id}`;
      }
    } catch (e) {
      toast('저장 실패: ' + e.message);
    }
  });
  init();
</script>
</body>
</html>
