<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <title>글 폼</title>
</head>
<body>
<section>
  <h2 id="formTitle">새 글 쓰기</h2>

  <form id="postForm">
    <div>
      <label>제목</label>
      <input type="text" name="postTitle" maxlength="120" required/>
    </div>

    <div>
      <label>작성자</label>
      <input type="hidden" name="userNickname" id="userNickname" th:value="${session.userNickname}/>
    </div>

    <div>
      <label>내용</label>
      <textarea name="postContent" rows="12" required></textarea>
    </div>

    <div style="display:flex; gap:8px; justify-content:flex-end;">
      <a href="/posts/list">목록</a>
      <button type="submit">저장</button>
    </div>
  </form>
</section>

<script>
  async function httpJson(url, opt = {}) {
    const res = await fetch(url, {
      headers: {'Content-Type': 'application/json', ...(opt.headers || {})},
      credentials: 'same-origin',
      ...opt
    });
    if (!res.ok) {
      throw new Error(`[${res.status}] ${await res.text().catch(() => res.statusText)}`);
    }
    const ct = res.headers.get('Content-Type') || '';
    return ct.includes('application/json') ? res.json() : res.text();
  }

  const path = location.pathname; // /posts/new or /posts/{id}/edit
  const isEdit = /\/edit$/.test(path);
  const id = isEdit ? path.split('/').slice(-2)[0] : null;
  const $f = document.getElementById('postForm');
  const $title = document.getElementById('formTitle');

  async function init() {
    if (isEdit) {
      $title.textContent = '글 수정';
      const p = await httpJson(`/api/posts/${id}`);
      $f.postTitle.value = p.postTitle;
      $f.userNickname.value = p.userNickname;
      $f.postContent.value = p.postContent;
    } else {
      $title.textContent = '새 글 쓰기';
    }
  }

  $f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const body = JSON.stringify({
      postTitle: $f.postTitle.value.trim(),
      userNickname: $f.userNickname.value.trim(),
      postContent: $f.postContent.value.trim()
    });

    try {
      if (isEdit) {
        await httpJson(`/api/posts/${id}`, {method: 'PUT', body});
        location.href = `/posts/${id}`;
      } else {
        const res = await httpJson('/api/posts', {method: 'POST', body});
        location.href = `/posts/${res.id}`;
      }
    } catch (err) {
      alert('저장 실패: ' + err.message);
    }
  });

  init();
</script>
</body>
</html>
