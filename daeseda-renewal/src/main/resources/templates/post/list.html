<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <title>게시글 목록</title>
  <link rel="shortcut icon" href="#">
</head>
<body>
<section>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="m-0">게시글 목록</h2>
    <a class="btn btn-dark" th:href="@{/posts/form}">글쓰기</a>
  </div>

  <form class="row gy-2 gx-2 align-items-end mb-3" id="searchForm">
    <div class="col-md-4">
      <label class="form-label">검색(제목/내용/작성자)</label>
      <input class="form-control" type="text" name="q">
    </div>
    <div class="col-md-3">
      <label class="form-label">정렬</label>
      <select class="form-select" name="sort">
        <option value="latest">최신순</option>
        <option value="oldest">오래된순</option>
        <option value="mostViewed">조회수순</option>
      </select>
    </div>
    <div class="col-md-2">
      <label class="form-label">페이지 크기</label>
      <select class="form-select" name="size">
        <option value="10">10</option>
        <option value="20">20</option>
        <option value="50">50</option>
      </select>
    </div>
    <div class="col-md-3 text-end">
      <button type="submit" class="btn btn-primary">검색</button>
      <button type="button" class="btn btn-outline-secondary" id="resetBtn">초기화</button>
    </div>
  </form>

  <div class="table-responsive">
    <table class="table table-hover align-middle" id="listTable">
      <thead class="table-light">
      <tr>
        <th style="width:8%">글번호</th>
        <th>제목</th>
        <th style="width:18%">작성자</th>
        <th style="width:22%">작성일</th>
        <th style="width:10%" class="text-end">조회</th>
      </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <nav class="mt-3">
    <ul class="pagination justify-content-center" id="pager"></ul>
  </nav>

  <script>
    const $f = document.getElementById('searchForm');
    const $tb = document.querySelector('#listTable tbody');
    const $pg = document.getElementById('pager');

    async function httpJson(url, options = {}) {
      const res = await fetch(url, {credentials: 'same-origin', ...options});
      const ct = res.headers.get('content-type') || '';
      if (!res.ok) {
        const text = await res.text().catch(() => '');
        throw new Error(`HTTP ${res.status} ${res.statusText}\n${text}`);
      }
      return ct.includes('application/json') ? res.json() : Promise.reject(new Error('Not JSON'));
    }

    const init = () => {
      const p = new URLSearchParams(location.search);
      $f.q.value = p.get('q') || '';
      $f.sort.value = p.get('sort') || 'latest';
      $f.size.value = p.get('size') || '10';
    };

    let page = Number(new URLSearchParams(location.search).get('page') || 0);

    $f.addEventListener('submit', (e) => {
      e.preventDefault();
      page = 0;
      navigate();
    });

    document.getElementById('resetBtn').onclick = () => {
      $f.q.value = '';
      $f.sort.value = 'latest';
      $f.size.value = '10';
      page = 0;
      navigate();
    };

    function navigate() {
      const params = new URLSearchParams({
        q: $f.q.value.trim(),
        sort: $f.sort.value,
        size: $f.size.value,
        page
      });
      history.pushState({}, '', `?${params.toString()}`);
      load();
    }

    window.addEventListener('popstate', () => {
      init();
      page = Number(new URLSearchParams(location.search).get('page') || 0);
      load();
    });

    async function load() {
      const params = new URLSearchParams({
        page,
        size: $f.size.value,
        q: $f.q.value.trim(),
        sort: $f.sort.value
      });

      try {
        const data = await httpJson(`/api/posts?${params.toString()}`);
        render(data);
      } catch (e) {
        $tb.innerHTML = `<tr><td colspan="5" class="text-center py-5 text-muted">조회 실패</td></tr>`;
        $pg.innerHTML = '';
      }
    }

    function render(data) {
      const fmt = (iso) => iso ? new Date(iso).toLocaleString() : '';

      $tb.innerHTML = data.content.length
          ? data.content.map(p => `
        <tr>
          <td>${p.postId}</td>
          <td><a class="text-decoration-none" href="/posts/${p.postId}">${p.postTitle}</a></td>
          <td>${p.userNickname}</td>
          <td>${fmt(p.createdAt)}</td>
          <td class="text-end">${p.views}</td>
        </tr>`).join('')
          : `<tr><td colspan="5" class="text-center py-5 text-muted">게시글이 없습니다.</td></tr>`;

      $pg.innerHTML = '';
      const add = (disabled, text, toPage) => {
        const li = document.createElement('li');
        li.className = `page-item ${disabled ? 'disabled' : ''}`;
        li.innerHTML = `<a class="page-link" href="#">${text}</a>`;
        if (!disabled) {
          li.onclick = (e) => {
            e.preventDefault();
            page = toPage;
            navigate();
          };
        }
        $pg.appendChild(li);
      };

      add(data.first, '이전', data.number - 1);
      for (let i = 0; i < data.totalPages; i++) {
        const li = document.createElement('li');
        li.className = `page-item ${i === data.number ? 'active' : ''}`;
        li.innerHTML = `<a class="page-link" href="#">${i + 1}</a>`;
        li.onclick = (e) => {
          e.preventDefault();
          page = i;
          navigate();
        };
        $pg.appendChild(li);
      }
      add(data.last, '다음', data.number + 1);
    }

    init();
    load();
  </script>

</section>
</body>
</html>
